<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng ký · SLED</title><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='brand.css') }}"></head><body class="login-body"><main class="login-card register-card"><a class="brand dark"><img class="brand-logo" src="{{ url_for('static', filename='sled-logo.svg') }}" alt="SLED"></a><span class="eyebrow">TẠO TÀI KHOẢN MỚI</span><h1>Đăng ký tài khoản</h1><p>Tạo tài khoản để làm việc cùng hệ thống kho SLED.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label>Họ và tên<input name="name" value="{{ request.form.get('name','') }}" required placeholder="VD: Nguyễn Văn A"></label><label>Email<input name="email" type="email" value="{{ request.form.get('email','') }}" required placeholder="ten@congty.vn"></label><label>Vai trò<select name="role"><option value="sales" {{ 'selected' if request.form.get('role')=='sales' }}>Sale</option><option value="technician" {{ 'selected' if request.form.get('role')=='technician' }}>Thợ</option></select></label><label>Mật khẩu<input name="password" type="password" required minlength="6" placeholder="Ít nhất 6 ký tự"></label><label>Xác nhận mật khẩu<input name="confirm_password" type="password" required minlength="6" placeholder="Nhập lại mật khẩu"></label><button class="primary full">Tạo tài khoản</button></form><p class="auth-switch">Đã có tài khoản? <a href="{{ url_for('auth.login') }}">Đăng nhập</a></p></main></body></html>
