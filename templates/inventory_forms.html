{% macro product_fields(p=none) -%}
<div class="form-grid"><label>Mã sản phẩm<input name="sku" value="{{ p.sku if p else '' }}" placeholder="Nhập mã sản phẩm" required maxlength="80"></label><label>Tên sản phẩm<input name="name" value="{{ p.name if p else '' }}" placeholder="Nhập tên sản phẩm" required maxlength="240"></label><label>Đơn vị tính<input name="unit" value="{{ p.unit if p else 'cái' }}" required placeholder="Cái, bộ…"></label><label>Nhóm sản phẩm<input name="category" value="{{ p.category if p else '' }}" placeholder="Chọn tên nhóm phù hợp"></label><label>Giá bán (₫)<input name="price" type="number" min="0" max="1000000000000" step="1" value="{{ p.price if p else 0 }}" required></label><label>Hình ảnh<input name="image_url" type="url" value="{{ p.image_url if p else '' }}" placeholder="Dán đường dẫn hình ảnh"></label><label class="wide">Mô tả<textarea name="description" placeholder="Thông tin bổ sung về sản phẩm">{{ p.description if p else '' }}</textarea></label></div>
{%- endmacro %}
{% macro component_fields(c=none) -%}
<div class="form-grid"><label>Mã linh kiện<input name="sku" value="{{ c.sku if c else '' }}" placeholder="Nhập mã linh kiện" required maxlength="80"></label><label>Tên linh kiện<input name="name" value="{{ c.name if c else '' }}" placeholder="Nhập tên linh kiện" required maxlength="240"></label><label>Đơn vị cơ sở<input name="unit" value="{{ c.unit if c else 'cái' }}" placeholder="Cái, bộ, mét, kg…" required></label><label>Nhóm linh kiện<select name="category_id"><option value="">Chưa phân nhóm</option>{% for cat in categories %}<option value="{{ cat.id }}" {{ 'selected' if c and c.category_id==cat.id }}>{{ cat.name }}</option>{% endfor %}</select></label>{% if not c %}<label>Tồn đầu kỳ<input name="stock" type="number" min="0" max="1000000000" step="0.000001" value="0" required></label>{% endif %}<label>Ngưỡng cần bổ sung<input name="min_stock" type="number" min="0" max="1000000000" step="0.000001" value="{{ c.min_stock if c else 0 }}" required></label></div>
{%- endmacro %}
