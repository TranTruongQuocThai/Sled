{% extends 'auth_base.html' %}{% block title %}Đăng nhập · SLED{% endblock %}{% block heading %}Chào mừng trở lại{% endblock %}{% block description %}Đăng nhập để tiếp tục công việc của bạn.{% endblock %}{% block form %}
<form method="post">{{ csrf_field() }}<div class="form-grid one"><label>Email<input name="email" type="email" value="{{ request.form.get('email','') }}" autocomplete="username" placeholder="Nhập email của bạn" required autofocus></label><label>Mật khẩu<span class="password-field"><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required><button type="button" class="icon-button" data-password-toggle="login-password" aria-label="Hiện mật khẩu" aria-pressed="false">{{ icon('eye',18) }}</button></span></label></div><button class="button button-primary button-full" type="submit">Đăng nhập {{ icon('arrow',16) }}</button></form><p class="auth-switch">Chưa có tài khoản?<a href="{{ url_for('auth.register') }}">Tạo tài khoản</a></p>
{% endblock %}
